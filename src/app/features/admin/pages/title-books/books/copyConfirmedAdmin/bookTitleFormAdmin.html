<div class="modal-container">
  <!-- Header -->
  <div class="modal-header border-0 pb-0">
    <h5 class="modal-title h4 fw-bold text-white">
      <span class="accent-line"></span>
      Añadir
    </h5>
    <button type="button" class="btn-close btn-close-white" aria-label="Close"
      (click)="modalActivate?.close()"></button>
  </div>

  <!-- Body -->
  <div class="modal-body py-4">

    <form class="row g-3" [formGroup]="formData">
      <!-- Full Name -->
      <div class="col-12">
        <label class="form-label text-light small fw-semibold">Registro de copia</label>
        <div class="input-group-custom">
          <input type="text" class="form-control-custom" formControlName="copyNumber" readonly />
        </div>
      </div>


      <!-- Footer -->
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn-cancel" (click)="modalActivate?.close()">
          Cancelar
        </button>
        <button type="submit" class="btn-submit" (click)="create()">
          <span>Guardar</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ms-2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </form>
  </div>
</div>
