<div class="register-container">
    <!-- Left Side: Form -->
    <div class="form-side">
        <div class="form-wrapper">
            <header class="header">
                <div class="logo">
                    <div class="icon-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" />
                            <path d="M8 7h6" />
                            <path d="M8 11h8" />
                        </svg>
                    </div>
                    <span>Biblioteca 2.0</span>
                </div>
                <h1>Crear cuenta</h1>
                <p>Regístrate para gestionar tus préstamos y descubrir nuevos libros.</p>
            </header>

            <form class="register-form">
                <div class="form-row">
                    <!-- Name Field -->
                    <div class="form-group">
                        <label for="name">Nombre Completo</label>
                        <div class="input-wrapper">
                            <input type="text" id="name" placeholder="Ej: Juan Pérez" />
                        </div>
                    </div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="ejemplo@gmail.com" />
                    </div>
                </div>

                <div class="form-row">
                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="••••••••" />
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="form-group">
                        <label for="confirm-password">Confirmar Contraseña</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirm-password" placeholder="••••••••" />
                        </div>
                    </div>
                </div>

                <div class="terms-check">
                    <label>
                        <input type="checkbox">
                        Acepto los <a href="#">Términos y Condiciones</a>
                    </label>
                </div>

                <button type="submit" class="submit-btn">
                    Registrarse
                </button>

            </form>

            <div class="login-prompt">
                <p>¿Ya tienes una cuenta? <a routerLink="/login" href="/login">Inicia sesión aquí</a></p>
            </div>
            
        </div>
    </div>

    <!-- Right Side: Decorative -->
    <div class="image-side" role="presentation">
        <div class="overlay"></div>
        <div class="content-box">
            <div class="badge">Nuevo</div>
            <h2>Tu biblioteca personal te espera.</h2>
            <p>Únete a nuestra comunidad y accede a miles de títulos desde cualquier lugar.</p>
            <div class="stats">
                <div class="stat-item">
                    <span class="value">10k+</span>
                    <span class="label">Libros</span>
                </div>
                <div class="stat-item">
                    <span class="value">5k+</span>
                    <span class="label">Lectores</span>
                </div>
            </div>
        </div>
    </div>
</div>
