<aside class="sidebar" [class.open]="isOpen()">
    <div class="sidebar-header">
        <div class="logo">
            <div class="logo-icon">
                <i class="bi bi-book fs-4"></i>
            </div>
            <span class="logo-text">Biblioteca 2.0</span>
        </div>
    </div>

    <div class="user-profile">
        <div class="avatar">
            <img src="https://ui-avatars.com/api/?name=Admin+User&background=6366f1&color=fff" alt="User Avatar">
        </div>
        <div class="user-info">
            <span class="user-name">{{user.fullName}}</span>
            <span class="user-role">{{user.role}}</span>
        </div>
    </div>

    <nav class="sidebar-nav">
        @if (user.role === 'admin') {
        <div class="nav-section">
            <p class="section-title">ADMINISTRACIÓN</p>
            <ul class="nav-list">
                <li class="nav-item">
                    <a routerLink="/admin/home" routerLinkActive="active">
                        <i class="bi bi-grid-fill"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/admin/users" routerLinkActive="active">
                        <i class="bi bi-people"></i>
                        <span>Usuarios</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/admin/book-titles" routerLinkActive="active">
                        <i class="bi bi-journal-text"></i>
                        <span>Libros</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/admin/loans" routerLinkActive="active">
                        <i class="bi bi-calendar-check"></i>
                        <span>Préstamos</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/admin/reservations" routerLinkActive="active">
                        <i class="bi bi-bookmark-star"></i>
                        <span>Reservaciones</span>
                    </a>
                </li>
            </ul>
        </div>
        } @else if (user.role === 'student') {
        <div class="nav-section">
            <p class="section-title">BIBLIOTECA</p>
            <ul class="nav-list">
                <li class="nav-item">
                    <a routerLink="/student/books" routerLinkActive="active">
                        <i class="bi bi-book"></i>
                        <span>Ver Libros</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/student/reservations" routerLinkActive="active">
                        <i class="bi bi-bookmark-star"></i>
                        <span>Mis Reservas</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a routerLink="/student/loans" routerLinkActive="active">
                        <i class="bi bi-calendar-check"></i>
                        <span>Mis Préstamos</span>
                    </a>
                </li>
            </ul>
        </div>
        }
    </nav>

    <div class="sidebar-footer">
        <button class="logout-btn" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>Cerrar Sesión</span>
        </button>
    </div>
</aside>

<div class="sidebar-overlay" [class.visible]="isOpen()" (click)="toggleSidebar()"></div>

<button class="sidebar-toggle" [class.collapsed-btn]="!isOpen()" (click)="toggleSidebar()">
    <i class="bi bi-list fs-3"></i>
</button>
<main>
    <router-outlet></router-outlet>
</main>

<app-chat></app-chat>
